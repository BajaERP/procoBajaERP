spring.application.name=backend

# A conexao e fornecida pelo Docker Compose (ou pela configuracao de execucao local).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O esquema vem das migrations do Flyway; o Hibernate so confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sessao no servidor (docs/adr/0001-sessao-no-servidor.md). Em producao com HTTPS, defina PROCOBAJA_COOKIE_SEGURO=true.
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PROCOBAJA_COOKIE_SEGURO:false}

# Primeiro Capitao, criado na inicializacao quando nao existe nenhum Capitao ativo.
procobaja.capitao-inicial.ra=${PROCOBAJA_CAPITAO_INICIAL_RA:}
procobaja.capitao-inicial.nome=${PROCOBAJA_CAPITAO_INICIAL_NOME:}
procobaja.capitao-inicial.senha=${PROCOBAJA_CAPITAO_INICIAL_SENHA:}
